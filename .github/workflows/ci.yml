name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three run PowerShell 7.6 — the module is Core-only because the
        # bundled VellumPdf assemblies target .NET 10. No Windows PowerShell 5.1.
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      # Actions pinned to commit SHAs (not mutable tags) so a compromised
      # upstream tag cannot inject code into this workflow. Dependabot keeps
      # the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: '10.0.x'

      # PowerShell 7.6 is the first release on .NET 10, so it is the only host
      # that can load the net10.0 VellumPdf assemblies. Install it as a global
      # tool, pinned to an exact version, to be independent of whatever pwsh
      # the runner image ships.
      - name: Install PowerShell 7.6
        shell: bash
        run: dotnet tool install --global PowerShell --version 7.6.9

      - name: Put the .NET tools PowerShell first on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME '.dotnet/tools')

      - name: Report versions
        shell: bash
        run: |
          dotnet --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Restore VellumPdf assemblies
        shell: bash
        run: pwsh -NoProfile -File ./build.ps1 Restore

      - name: Lint (PSScriptAnalyzer)
        shell: bash
        run: pwsh -NoProfile -File ./build.ps1 Lint

      # Some tests render pages (poppler's pdftoppm + ImageMagick) or read the structure tree (qpdf) to check
      # output pixel for pixel; they skip themselves where the tools are missing, so install them where it is easy.
      - name: Install rendering tools for the pixel and structure tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q qpdf poppler-utils imagemagick

      - name: Install rendering tools for the pixel and structure tests (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf poppler imagemagick

      - name: Test (Pester + coverage)
        shell: bash
        run: pwsh -NoProfile -File ./build.ps1 Test

      # A German culture writes 0,5 for 0.5: code or tests that format or parse numbers without the
      # invariant culture only fail here. Same suite, no coverage; any failed test fails the step.
      - name: Test under de-DE (Pester, no coverage)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          [cultureinfo]::CurrentCulture = 'de-DE'
          [cultureinfo]::CurrentUICulture = 'de-DE'
          Import-Module Pester -MinimumVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = Join-Path $PWD 'tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Normal'
          $result = Invoke-Pester -Configuration $cfg
          if ($result.Result -ne 'Passed' -or $result.FailedCount -gt 0) {
              throw "Pester run under de-DE failed: $($result.FailedCount) test(s) failed."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: testResults/
          if-no-files-found: ignore

  # External conformance validation: qpdf checks PDF structure, veraPDF
  # validates PDF/A-2b/2u/2a and PDF/UA-1 compliance (the same validators
  # upstream VellumPdf gates on). Runs on ubuntu where Docker is available.
  validate:
    name: validate (qpdf + veraPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Install PowerShell 7.6
        shell: bash
        run: dotnet tool install --global PowerShell --version 7.6.9

      - name: Put the .NET tools PowerShell first on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME '.dotnet/tools')

      - name: Restore VellumPdf assemblies
        shell: bash
        run: pwsh -NoProfile -File ./build.ps1 Restore

      - name: Generate validation samples
        shell: bash
        run: pwsh -NoProfile -File ./tools/New-ValidationSamples.ps1 -OutputPath ./samples

      - name: Install qpdf
        shell: bash
        run: sudo apt-get update -q && sudo apt-get install -y -q qpdf

      - name: qpdf structural checks
        shell: bash
        run: |
          set -e
          qpdf --check samples/plain.pdf
          qpdf --check samples/pdfa2b.pdf
          qpdf --check samples/pdfa2b-signed.pdf
          qpdf --check samples/pdfa2b-jpx.pdf
          qpdf --check samples/pdfa2b-jbig2.pdf
          qpdf --check samples/pdfa2b-charts.pdf
          qpdf --check samples/pdfa2b-pages.pdf
          qpdf --check samples/pdfa2u-text.pdf
          qpdf --check samples/pdfa2a-pages.pdf
          qpdf --check samples/pdfua1.pdf
          qpdf --check samples/pdfua1-pages.pdf
          qpdf --check samples/pdfua1-structure.pdf
          qpdf --check samples/forms.pdf
          qpdf --check samples/linearized.pdf
          qpdf --check-linearization samples/linearized.pdf
          qpdf --check --password=validate samples/encrypted.pdf
          echo "qpdf: all samples structurally valid"

      - name: veraPDF PDF/A-2b validation
        shell: bash
        run: |
          set -o pipefail
          for f in pdfa2b pdfa2b-signed pdfa2b-jpx pdfa2b-jbig2 pdfa2b-charts pdfa2b-pages; do
            docker run --rm -v "$PWD/samples:/data" ghcr.io/verapdf/cli \
              --flavour 2b --format text "/data/$f.pdf" | tee verapdf.out
            grep -q '^PASS' verapdf.out || { echo "veraPDF did not report PASS for $f.pdf"; exit 1; }
            echo "veraPDF: $f.pdf is PDF/A-2b compliant"
          done

      - name: veraPDF PDF/UA-1 validation
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/samples:/data" ghcr.io/verapdf/cli \
            --flavour ua1 --format text "/data/pdfua1.pdf" | tee verapdf-ua.out
          grep -q '^PASS' verapdf-ua.out || { echo "veraPDF did not report PASS for pdfua1.pdf"; exit 1; }
          echo "veraPDF: pdfua1.pdf is PDF/UA-1 compliant"

      - name: veraPDF PDF/UA-1 on the tagged page documents
        shell: bash
        run: |
          set -o pipefail
          for sample in pdfua1-pages pdfua1-structure; do
            docker run --rm -v "$PWD/samples:/data" ghcr.io/verapdf/cli \
              --flavour ua1 --format text "/data/$sample.pdf" | tee "verapdf-ua-$sample.out"
            grep -q '^PASS' "verapdf-ua-$sample.out" || { echo "veraPDF did not report PASS for $sample.pdf"; exit 1; }
            echo "veraPDF: $sample.pdf is PDF/UA-1 compliant"
          done

      - name: veraPDF PDF/A-2u validation
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/samples:/data" ghcr.io/verapdf/cli \
            --flavour 2u --format text "/data/pdfa2u-text.pdf" | tee verapdf-2u.out
          grep -q '^PASS' verapdf-2u.out || { echo "veraPDF did not report PASS for pdfa2u-text.pdf"; exit 1; }
          echo "veraPDF: pdfa2u-text.pdf is PDF/A-2u compliant"

      - name: veraPDF PDF/A-2a validation
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/samples:/data" ghcr.io/verapdf/cli \
            --flavour 2a --format text "/data/pdfa2a-pages.pdf" | tee verapdf-2a.out
          grep -q '^PASS' verapdf-2a.out || { echo "veraPDF did not report PASS for pdfa2a-pages.pdf"; exit 1; }
          echo "veraPDF: pdfa2a-pages.pdf is PDF/A-2a compliant"

      - name: In-process preflight (Test-VellumPdfConformance)
        shell: pwsh
        run: |
          Import-Module ./PSVellumPDF.psd1
          $failed = @()
          foreach ($f in 'pdfa2b', 'pdfa2b-signed', 'pdfa2b-jpx', 'pdfa2b-jbig2', 'pdfa2b-charts', 'pdfa2b-pages', 'pdfa2u-text', 'pdfa2a-pages', 'pdfua1', 'pdfua1-pages', 'pdfua1-structure') {
              $r = Test-VellumPdfConformance -Path "samples/$f.pdf" -ErrorAction Stop
              $r | Format-Table Path, Profile, IsCompliant, ErrorCount, WarningCount | Out-String | Write-Host
              if (-not $r.IsCompliant) { $failed += $f }
          }
          if ($failed) { throw "In-process preflight failed for: $($failed -join ', ')" }

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-samples
          path: samples/
          if-no-files-found: ignore
